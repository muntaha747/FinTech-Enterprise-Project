apiVersion: v1
kind: Namespace
metadata:
  name: node-stress
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-io-stress
  namespace: node-stress
  labels:
    app: node-io-stress
spec:
  selector:
    matchLabels:
      app: node-io-stress
  template:
    metadata:
      labels:
        app: node-io-stress
    spec:
      initContainers:
        - name: raise-inotify-limits
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              sysctl -w fs.inotify.max_user_watches=524288
              sysctl -w fs.inotify.max_user_instances=512
      containers:
        - name: io-stress
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                dd if=/dev/zero of=/data/io-test bs=1M count=512 oflag=dsync
                dd if=/data/io-test of=/dev/null bs=1M iflag=direct
                rm -f /data/io-test
                sleep 10
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
