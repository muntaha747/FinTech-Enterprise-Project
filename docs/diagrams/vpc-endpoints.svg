<text x="40" y="432" text-anchor="start" class="t" fill="#ff416c">❌ WITHOUT ENDPOINTS · WHAT WE AVOID</text>
<rect x="40" y="445" width="200" height="64" rx="12" fill="#0f2036" stroke="#4facfe" stroke-width="1.8"/>
<text x="140.0" y="482.0" text-anchor="middle" class="t">⚙️ Private workload</text>
<rect x="330" y="445" width="200" height="64" rx="12" fill="#3a1424" stroke="#ff4081" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="430.0" y="474.0" text-anchor="middle" class="t">🔁 NAT Gateway</text>
<text x="430.0" y="491.0" text-anchor="middle" class="ts">$ per GB</text>
<rect x="620" y="445" width="200" height="64" rx="12" fill="#3a1424" stroke="#ff4081" stroke-width="1.8" stroke-dasharray="6 4"/>
