<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 600" width="1400" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>🚇 VPC endpoints · private access to AWS services</title>
<defs>
