.lab{fill:#d6deea;font-size:11px;font-style:italic}
</style></defs>
<rect width="1400" height="600" rx="18" fill="url(#bgGrad)"/>
<text x="36" y="42" class="t" font-size="21">🚇 VPC endpoints · private access to AWS services</text>
<text x="36" y="66" class="ts" font-size="12.5">Gateway endpoint for S3 · Interface endpoints for ECR and KMS · compared with the internet path they replace</text>
