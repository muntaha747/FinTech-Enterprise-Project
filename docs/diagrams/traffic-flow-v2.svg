<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 820" width="1400" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>FinTech platform - live traffic flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="0.5" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { fill: none; stroke-width: 2.5; stroke-dasharray: 10 8; animation: dash 1.1s linear infinite; opacity: .85 }
      .rev  { animation-direction: reverse }
      @keyframes dash { to { stroke-dashoffset: -18 } }
      .pulse { animation: pulse 2.4s ease-in-out infinite }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .t  { fill: #e6edf3; font-size: 14px; font-weight: 600 }
      .ts { fill: #b6c2d1; font-size: 11.5px }
      .th { fill: #ffffff; font-size: 16px; font-weight: 700 }
      .node { stroke-width: 1.6 }
    </style>
  </defs>

  <rect width="1400" height="820" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" class="th" font-size="22">🚦 Live traffic flow · FinTech platform on AWS us-east-1</text>
  <text x="40" y="68" class="ts">Customer request → edge → Transit Gateway → app (EKS) → data · with metrics, private AWS access and controlled egress</text>

  <!-- ===== VPC containers ===== -->
  <rect x="440" y="170" width="220" height="370" rx="16" fill="#10372b" stroke="#84fab0" stroke-width="2"/>
  <text x="454" y="192" class="t" fill="#84fab0" font-size="12.5">🚪 EDGE VPC · 10.10.0.0/16</text>

  <rect x="700" y="170" width="300" height="370" rx="16" fill="#12263f" stroke="#4facfe" stroke-width="2"/>
  <text x="716" y="164" class="t" fill="#4facfe">⚙️ APP VPC · 10.20.0.0/16</text>

  <rect x="1040" y="170" width="160" height="370" rx="16" fill="#2b1420" stroke="#ff416c" stroke-width="2"/>
  <text x="1054" y="194" class="t">🗄️ DATA VPC</text>
  <text x="1054" y="212" class="ts">10.30.0.0/16</text>

  <rect x="1230" y="170" width="150" height="370" rx="16" fill="#24123d" stroke="#c471f5" stroke-width="2"/>
  <text x="1244" y="194" class="t">🛠️ OPS VPC</text>
  <text x="1244" y="212" class="ts">10.40.0.0/16</text>

  <!-- ===== Transit Gateway bus ===== -->
  <rect x="440" y="588" width="940" height="54" rx="27" fill="url(#bus)" opacity=".22"/>
  <rect x="440" y="588" width="940" height="54" rx="27" fill="none" stroke="#ff9900" stroke-width="2.5" class="pulse" filter="url(#glow)"/>
  <text x="460" y="672" class="t" fill="#ffb84d">🔀 TRANSIT GATEWAY · hub for all VPCs · route 10.0.0.0/8 → TGW</text>
  <!-- attachments -->
  <g stroke="#ff9900" stroke-width="3" opacity=".7">
    <line x1="550" y1="540" x2="550" y2="588"/>
    <line x1="850" y1="540" x2="850" y2="588"/>
    <line x1="1120" y1="540" x2="1120" y2="588"/>
    <line x1="1305" y1="540" x2="1305" y2="588"/>
  </g>

  <!-- ===== flow paths (drawn under nodes) ===== -->
  <path id="pReq"  class="flow" stroke="#00e5ff" d="M112,328 H420 V222 H550 V603 H992 V209 H920 V292"/>
  <path id="pDb"   class="flow" stroke="#ffd200" d="M865,460 V615 H1120 V259"/>
  <path id="pMet"  class="flow" stroke="#ff8a65" d="M900,460 V627 H1305 V259"/>
  <path id="pEp"   class="flow" stroke="#e040fb" d="M965,337 H1020 V100 H1090"/>
  <path id="pEgr"  class="flow" stroke="#ff4081" d="M790,320 V120"/>

  <!-- ===== Internet side ===== -->
  <circle cx="70" cy="328" r="42" fill="#ff9a9e" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
  <text x="70" y="324" text-anchor="middle" font-size="22">👤</text>
  <text x="70" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Customer</text>

  <rect x="140" y="300" width="110" height="56" rx="9" class="node" fill="#2a1f3d" stroke="#fbc2eb"/>
  <text x="195" y="324" text-anchor="middle" class="t">🌐 Route 53</text>
  <text x="195" y="342" text-anchor="middle" class="ts">DNS</text>

  <rect x="275" y="292" width="130" height="72" rx="9" class="node" fill="#3a1424" stroke="#ff416c"/>
  <text x="340" y="316" text-anchor="middle" class="t">☁️ CloudFront</text>
  <text x="340" y="334" text-anchor="middle" class="ts">🛡️ WAF + Shield</text>
  <text x="340" y="350" text-anchor="middle" class="ts">TLS · rate limit</text>

  <!-- ===== Edge VPC nodes ===== -->
  <rect x="470" y="200" width="160" height="44" rx="9" class="node" fill="#14532d" stroke="#84fab0"/>
  <text x="550" y="227" text-anchor="middle" class="t">🌐 Internet Gateway</text>
  <rect x="470" y="300" width="160" height="56" rx="9" class="node" fill="#14532d" stroke="#84fab0"/>
  <text x="550" y="324" text-anchor="middle" class="t">🔌 API Gateway</text>
  <text x="550" y="342" text-anchor="middle" class="ts">REST · VPC Link</text>
  <rect x="470" y="440" width="160" height="50" rx="9" class="node" fill="#0f2a3d" stroke="#4facfe" stroke-dasharray="4 3"/>
  <text x="550" y="461" text-anchor="middle" class="ts">private 10.10.11-13.0/24</text>
  <text x="550" y="478" text-anchor="middle" class="ts">TGW attachment ENIs</text>

  <!-- ===== App VPC nodes ===== -->
  <rect x="715" y="190" width="130" height="38" rx="9" class="node" fill="#14532d" stroke="#84fab0"/>
  <text x="780" y="214" text-anchor="middle" class="t">🔁 NAT GW</text>
  <rect x="855" y="190" width="130" height="38" rx="9" class="node" fill="#14532d" stroke="#84fab0"/>
  <text x="920" y="214" text-anchor="middle" class="t">⚖️ ALB</text>

  <rect x="715" y="245" width="270" height="215" rx="12" fill="#0e1f3a" stroke="#326ce5" stroke-width="1.6"/>
  <text x="728" y="266" class="ts" fill="#8fb8ff">☸️ EKS · control + data plane subnets</text>
  <rect x="735" y="275" width="230" height="34" rx="9" class="node" fill="#2a1245" stroke="#c471f5"/>
  <text x="850" y="297" text-anchor="middle" class="t">🔀 bff-service</text>
  <rect x="735" y="320" width="230" height="34" rx="9" class="node" fill="#0b3d2e" stroke="#43e97b"/>
  <text x="850" y="342" text-anchor="middle" class="t">💸 payment-service</text>
  <rect x="735" y="365" width="230" height="34" rx="9" class="node" fill="#3d2400" stroke="#f7971e"/>
  <text x="850" y="387" text-anchor="middle" class="t">🕵️ fraud-service</text>
  <rect x="735" y="410" width="230" height="34" rx="9" class="node" fill="#0b3d2e" stroke="#43e97b"/>
  <text x="850" y="432" text-anchor="middle" class="t">📒 ledger-service</text>

  <rect x="715" y="475" width="270" height="44" rx="9" class="node" fill="#2a1245" stroke="#e040fb" stroke-dasharray="4 3"/>
  <text x="850" y="502" text-anchor="middle" class="ts">🚇 VPC endpoints · ECR · S3 · KMS</text>

  <!-- ===== Data VPC nodes ===== -->
  <rect x="1055" y="215" width="130" height="44" rx="9" class="node" fill="#3a1424" stroke="#ff416c"/>
  <text x="1120" y="242" text-anchor="middle" class="t">🐬 MySQL</text>
  <rect x="1055" y="275" width="130" height="44" rx="9" class="node" fill="#3a1424" stroke="#ff416c"/>
  <text x="1120" y="302" text-anchor="middle" class="t">⚡ Valkey</text>
  <rect x="1055" y="335" width="130" height="44" rx="9" class="node" fill="#3a1424" stroke="#ff416c"/>
  <text x="1120" y="362" text-anchor="middle" class="t">📨 Kafka</text>
  <rect x="1055" y="440" width="130" height="50" rx="9" class="node" fill="#3a1424" stroke="#ff416c"/>
  <text x="1120" y="461" text-anchor="middle" class="ts">🍃 MongoDB</text>
  <text x="1120" y="478" text-anchor="middle" class="ts">🔎 OpenSearch</text>

  <!-- ===== Ops VPC nodes ===== -->
  <rect x="1242" y="215" width="126" height="44" rx="9" class="node" fill="#2a1245" stroke="#c471f5"/>
  <text x="1305" y="242" text-anchor="middle" class="t">🔥 Prometheus</text>
  <rect x="1242" y="275" width="126" height="44" rx="9" class="node" fill="#2a1245" stroke="#c471f5"/>
  <text x="1305" y="302" text-anchor="middle" class="t">📈 Grafana</text>
  <rect x="1242" y="335" width="126" height="44" rx="9" class="node" fill="#2a1245" stroke="#c471f5"/>
  <text x="1305" y="362" text-anchor="middle" class="t">🔐 Vault</text>
  <rect x="1242" y="440" width="126" height="50" rx="9" class="node" fill="#2a1245" stroke="#c471f5"/>
  <text x="1305" y="461" text-anchor="middle" class="ts">🐙 Argo CD</text>
  <text x="1305" y="478" text-anchor="middle" class="ts">Kubeflow · MLflow</text>

  <!-- ===== Top band: external + AWS services ===== -->
  <rect x="760" y="70" width="230" height="50" rx="9" class="node" fill="#3a1424" stroke="#ff4081"/>
  <text x="875" y="92" text-anchor="middle" class="t">🌍 Payment network / PSP API</text>
  <text x="875" y="109" text-anchor="middle" class="ts">outbound only via NAT</text>

  <rect x="1040" y="74" width="340" height="52" rx="12" fill="#1f1530" stroke="#e040fb" stroke-width="1.6"/>
  <text x="1210" y="94" text-anchor="middle" class="t">☁️ AWS services · never via internet</text>
  <text x="1210" y="113" text-anchor="middle" class="ts">📦 ECR · 🪣 S3 · 🔐 KMS</text>

  <!-- ===== packets ===== -->
  <g filter="url(#glow)">
    <!-- request: customer -> payments -->
    <circle r="7" fill="#00e5ff"><animateMotion dur="5s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#pReq"/></animateMotion></circle>
    <circle r="7" fill="#00e5ff"><animateMotion dur="5s" repeatCount="indefinite" begin="1.7s"><mpath xlink:href="#pReq"/></animateMotion></circle>
    <circle r="7" fill="#00e5ff"><animateMotion dur="5s" repeatCount="indefinite" begin="3.4s"><mpath xlink:href="#pReq"/></animateMotion></circle>
    <!-- response: payments -> customer -->
    <circle r="5" fill="#43e97b"><animateMotion dur="5s" repeatCount="indefinite" begin="0.8s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#pReq"/></animateMotion></circle>
    <circle r="5" fill="#43e97b"><animateMotion dur="5s" repeatCount="indefinite" begin="3.2s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#pReq"/></animateMotion></circle>
    <!-- database -->
    <rect x="-7" y="-5" width="14" height="10" rx="2" fill="#ffd200"><animateMotion dur="3s" repeatCount="indefinite" begin="0.5s" rotate="auto"><mpath xlink:href="#pDb"/></animateMotion></rect>
    <rect x="-7" y="-5" width="14" height="10" rx="2" fill="#ffd200"><animateMotion dur="3s" repeatCount="indefinite" begin="2s" rotate="auto"><mpath xlink:href="#pDb"/></animateMotion></rect>
    <!-- metrics -->
    <circle r="5" fill="#ff8a65"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#pMet"/></animateMotion></circle>
    <circle r="5" fill="#ff8a65"><animateMotion dur="3.6s" repeatCount="indefinite" begin="1.8s"><mpath xlink:href="#pMet"/></animateMotion></circle>
    <!-- private endpoint -->
    <circle r="6" fill="#e040fb"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.3s"><mpath xlink:href="#pEp"/></animateMotion></circle>
    <circle r="6" fill="#e040fb"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.6s"><mpath xlink:href="#pEp"/></animateMotion></circle>
    <!-- egress -->
    <circle r="6" fill="#ff4081"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1s"><mpath xlink:href="#pEgr"/></animateMotion></circle>
  </g>

  <!-- ===== legend ===== -->
  <rect x="40" y="696" width="1340" height="112" rx="14" fill="#0d1526" stroke="#2b3a55"/>
    <circle cx="70" cy="723" r="7" fill="#00e5ff"/><text x="86" y="728" class="t">Request</text><text x="86" y="746" class="ts">Customer → CloudFront/WAF → API Gateway → TGW → ALB → BFF</text>
    <circle cx="520" cy="723" r="7" fill="#43e97b"/><text x="536" y="728" class="t">Response</text><text x="536" y="746" class="ts">Same path back to the customer</text>
    <rect x="963" y="718" width="14" height="10" rx="2" fill="#ffd200"/><text x="986" y="728" class="t">Database query</text><text x="986" y="746" class="ts">app → TGW → data VPC (MySQL · Valkey · Kafka)</text>
    <circle cx="70" cy="771" r="7" fill="#ff8a65"/><text x="86" y="776" class="t">Metrics / logs</text><text x="86" y="794" class="ts">app → TGW → ops VPC (Prometheus · Grafana)</text>
    <circle cx="520" cy="771" r="7" fill="#e040fb"/><text x="536" y="776" class="t">Private AWS access</text><text x="536" y="794" class="ts">VPC endpoints → ECR · S3 · KMS</text>
    <circle cx="970" cy="771" r="7" fill="#ff4081"/><text x="986" y="776" class="t">Egress</text><text x="986" y="794" class="ts">app pods → NAT Gateway → payment network</text>
</svg>
