<rect x="-8" y="-5.5" width="16" height="11" rx="2.5" fill="#ffd200"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.0s"><mpath xlink:href="#p1"/></animateMotion></rect>
<rect x="-8" y="-5.5" width="16" height="11" rx="2.5" fill="#ffd200"><animateMotion dur="1.4s" repeatCount="indefinite" begin="0.7s"><mpath xlink:href="#p1"/></animateMotion></rect>
