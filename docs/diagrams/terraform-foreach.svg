<rect x="40" y="190" width="250" height="260" rx="12" fill="#2e2708" stroke="#ffd200" stroke-width="1.8"/>
<text x="165.0" y="317.0" text-anchor="middle" class="t">📄 locals.tf</text>
<text x="165.0" y="334.0" text-anchor="middle" class="ts">vpcs = {</text>
<text x="165.0" y="348.0" text-anchor="middle" class="ts">  edge = 10.10.0.0/16</text>
<text x="165.0" y="362.0" text-anchor="middle" class="ts">  app  = 10.20.0.0/16</text>
<text x="165.0" y="376.0" text-anchor="middle" class="ts">  data = 10.30.0.0/16</text>
<text x="165.0" y="390.0" text-anchor="middle" class="ts">  ops  = 10.40.0.0/16</text>
<text x="165.0" y="404.0" text-anchor="middle" class="ts">}</text>
<text x="165.0" y="418.0" text-anchor="middle" class="ts">azs = 1a · 1b · 1c</text>
<rect x="350" y="270" width="210" height="100" rx="12" fill="#22123a" stroke="#c471f5" stroke-width="1.8" filter="url(#glow)"/>
<text x="455.0" y="317.0" text-anchor="middle" class="t">🔁 module "network"</text>
<text x="455.0" y="334.0" text-anchor="middle" class="ts">for_each = local.vpcs</text>
<rect x="640" y="100" width="270" height="96" rx="12" fill="#10372b" stroke="#84fab0" stroke-width="1.8"/>
