<circle r="6" fill="#4facfe"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.35s"><mpath xlink:href="#p5"/></animateMotion></circle>
<circle r="6" fill="#ff416c"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.9s"><mpath xlink:href="#p6"/></animateMotion></circle>
