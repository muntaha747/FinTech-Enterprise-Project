<path id="p8" class="flow" d="M560,320 H600 V508 H640" stroke="#c471f5" stroke-width="2.4" opacity="0.85"/>
<path id="p9" class="flow" d="M910,508 H950 V320 H990" stroke="#c471f5" stroke-width="2.4" opacity="0.85"/>
