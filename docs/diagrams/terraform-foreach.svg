<text x="775.0" y="402.0" text-anchor="middle" class="ts">VPC · subnets · route tables</text>
<text x="775.0" y="416.0" text-anchor="middle" class="ts">SGs · NAT/IGW · VPC endpoints</text>
<rect x="640" y="460" width="270" height="96" rx="12" fill="#22123a" stroke="#c471f5" stroke-width="1.8"/>
<text x="775.0" y="505.0" text-anchor="middle" class="t" font-size="12.5">module.network["ops"]</text>
<text x="775.0" y="522.0" text-anchor="middle" class="ts">VPC · subnets · route tables</text>
<text x="775.0" y="536.0" text-anchor="middle" class="ts">SGs · NAT/IGW · VPC endpoints</text>
<rect x="990" y="250" width="200" height="140" rx="12" fill="#2d1c05" stroke="#ff9900" stroke-width="1.8"/>
<text x="1090.0" y="317.0" text-anchor="middle" class="t">🔀 transit_gateway.tf</text>
<text x="1090.0" y="334.0" text-anchor="middle" class="ts">attachment per VPC</text>
<text x="1090.0" y="348.0" text-anchor="middle" class="ts">10.0.0.0/8 routes</text>
<circle cx="1295" cy="320" r="66" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="6 9" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="0 1295 320" to="360 1295 320" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="1295" cy="320" r="52" fill="#ff9900" filter="url(#glow)" class="pulse"/>
<text x="1295" y="320" text-anchor="middle" class="h">TGW</text>
<text x="1295" y="337" text-anchor="middle" class="hc">hub</text>
<rect x="24" y="609" width="1352" height="46" rx="12" fill="#0d1526" stroke="#2b3a55"/>
<circle cx="40" cy="632" r="6" fill="#ffd200"/>
<text x="52" y="636" text-anchor="start" class="t" font-size="12">locals → module</text>
<circle cx="197.0" cy="632" r="6" fill="#4facfe"/>
