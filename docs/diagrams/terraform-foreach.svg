<circle r="6" fill="#c471f5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.35s"><mpath xlink:href="#p8"/></animateMotion></circle>
<circle r="6" fill="#c471f5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="2.25s"><mpath xlink:href="#p9"/></animateMotion></circle>
<circle r="6" fill="#ff9900"><animateMotion dur="1.0s" repeatCount="indefinite" begin="0.0s"><mpath xlink:href="#p10"/></animateMotion></circle>
<circle r="6" fill="#ff9900"><animateMotion dur="1.0s" repeatCount="indefinite" begin="0.5s"><mpath xlink:href="#p10"/></animateMotion></circle>
