.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.t{fill:#eef3f8;font-size:13.5px;font-weight:700}
.ts{fill:#aab8cb;font-size:11.5px}
.h{fill:#0a0f1e;font-size:14px;font-weight:800}
