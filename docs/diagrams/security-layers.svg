<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 760" width="1400" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>🛡️ Security checkpoints · every request passes 9 gates</title>
<defs>
