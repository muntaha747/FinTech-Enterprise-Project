<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>EKS control plane, four node groups, Cluster Autoscaler with IRSA and the blue/green switch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a00c9a7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00c9a7"/></marker><marker id="a4facfe" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4facfe"/></marker><marker id="ac471f5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c471f5"/></marker><marker id="ae6edf3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker><marker id="aff4f9a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4f9a"/></marker><marker id="aff9900" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9900"/></marker>
    <style>
      .flow { stroke-dasharray: 10 8; animation: dash 1.1s linear infinite; opacity: .9 }
      .solid { opacity: .9 }
      @keyframes dash { to { stroke-dashoffset: -18 } }
      .pulse { animation: pulse 2.4s ease-in-out infinite }
      @keyframes pulse { 0%,100% { opacity: .6 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect width="1400" height="860" rx="18" fill="url(#bg)"/>
  <text x="36" y="42" font-size="20" font-weight="700" fill="#ffffff">☸️ EKS platform · control plane, blue/green node groups and the Cluster Autoscaler</text>
  <text x="36" y="66" font-size="13" fill="#b6c2d1">One Terraform module (EKS/modules/eks_cluster) builds all of this for every environment · the nodes live in the App VPC&#x27;s private subnets</text>
  <rect x="36" y="104" width="300" height="60" rx="12" fill="#e6edf3" fill-opacity="0.14" stroke="#e6edf3" stroke-width="1.6"/>
  <text x="186.0" y="132.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">👩‍💻 kubectl · GitHub Actions</text>
  <text x="186.0" y="148.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">log in with IAM, never a password</text>
  <rect x="36" y="196" width="300" height="336" rx="16" fill="#4facfe" fill-opacity="0.05" stroke="#4facfe" stroke-width="1.8"/>
  <text x="52.0" y="222.0" font-size="14.5" fill="#4facfe" text-anchor="start" font-weight="700">🧠 Control plane (managed by AWS)</text>
  <rect x="52" y="240" width="268" height="56" rx="12" fill="#4facfe" fill-opacity="0.14" stroke="#4facfe" stroke-width="1.6"/>
  <text x="186.0" y="266.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">Kubernetes API · v1.36</text>
  <text x="186.0" y="282.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">private + public endpoint</text>
  <rect x="52" y="310" width="268" height="56" rx="12" fill="#4facfe" fill-opacity="0.14" stroke="#4facfe" stroke-width="1.6"/>
  <text x="186.0" y="336.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🔑 Access entries</text>
  <text x="186.0" y="352.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">who may log in · no aws-auth file</text>
  <rect x="52" y="380" width="268" height="56" rx="12" fill="#4facfe" fill-opacity="0.14" stroke="#4facfe" stroke-width="1.6"/>
  <text x="186.0" y="406.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🔐 Secrets</text>
  <text x="186.0" y="422.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">encrypted with a KMS key</text>
  <rect x="52" y="450" width="268" height="56" rx="12" fill="#4facfe" fill-opacity="0.14" stroke="#4facfe" stroke-width="1.6"/>
  <text x="186.0" y="476.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">📜 5 log types</text>
  <text x="186.0" y="492.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">audit trail → CloudWatch</text>
  <rect x="36" y="562" width="300" height="60" rx="12" fill="#ff4f9a" fill-opacity="0.14" stroke="#ff4f9a" stroke-width="1.6"/>
  <text x="186.0" y="590.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🪪 OIDC provider</text>
  <text x="186.0" y="606.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">lets ONE pod use ONE IAM role</text>
  <rect x="380" y="104" width="560" height="428" rx="16" fill="#c471f5" fill-opacity="0.05" stroke="#c471f5" stroke-width="1.8"/>
  <text x="396.0" y="130.0" font-size="14.5" fill="#c471f5" text-anchor="start" font-weight="700">💪 Data plane · 4 managed node groups</text>
  <text x="396.0" y="148.0" font-size="11.5" fill="#b6c2d1" text-anchor="start">t3.medium · private subnets · one shared worker IAM role</text>
  <rect x="400" y="170" width="250" height="130" rx="12" fill="#4facfe" fill-opacity="0.14" stroke="#4facfe" stroke-width="1.6" class="pulse"/>
  <text x="525.0" y="218.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🔵 Core blue</text>
  <text x="525.0" y="234.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">normal application pods</text>
  <text x="525.0" y="249.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">min 1 · max 10</text>
  <text x="525.0" y="264.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">running today: 1 node</text>
  <rect x="670" y="170" width="250" height="130" rx="12" fill="#43e97b" fill-opacity="0.14" stroke="#43e97b" stroke-width="1.6"/>
  <text x="795.0" y="218.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🟢 Core green</text>
  <text x="795.0" y="234.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">same job, the other colour</text>
  <text x="795.0" y="249.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">min 0 · max 10</text>
  <text x="795.0" y="264.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">standby: 0 nodes</text>
  <rect x="400" y="320" width="250" height="130" rx="12" fill="#4facfe" fill-opacity="0.14" stroke="#4facfe" stroke-width="1.6"/>
  <text x="525.0" y="368.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🔵 ML blue</text>
  <text x="525.0" y="384.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">taint: dedicated = ml-inference</text>
  <text x="525.0" y="399.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">only ML pods may land here</text>
  <text x="525.0" y="414.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">min 0 · max 10</text>
  <rect x="670" y="320" width="250" height="130" rx="12" fill="#43e97b" fill-opacity="0.14" stroke="#43e97b" stroke-width="1.6"/>
  <text x="795.0" y="368.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">🟢 ML green</text>
  <text x="795.0" y="384.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">taint: dedicated = ml-inference</text>
  <text x="795.0" y="399.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">only ML pods may land here</text>
  <text x="795.0" y="414.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">min 0 · max 10</text>
  <text x="660.0" y="492.0" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700">Terraform sets min and max · the autoscaler owns the live node count</text>
  <text x="660.0" y="512.0" font-size="11.5" fill="#b6c2d1" text-anchor="middle">(ignore_changes on desired_size, so a push never removes busy nodes)</text>
  <rect x="980" y="104" width="384" height="518" rx="16" fill="#ff9900" fill-opacity="0.05" stroke="#ff9900" stroke-width="1.8"/>
  <text x="996.0" y="130.0" font-size="14.5" fill="#ff9900" text-anchor="start" font-weight="700">📈 Cluster Autoscaler loop (IRSA)</text>
  <rect x="1000" y="148" width="344" height="52" rx="12" fill="#ff9900" fill-opacity="0.14" stroke="#ff9900" stroke-width="1.6"/>
  <text x="1172.0" y="172.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">1 · A pod is Pending</text>
  <text x="1172.0" y="188.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">no node has room for it</text>
  <rect x="1000" y="226" width="344" height="52" rx="12" fill="#ff9900" fill-opacity="0.14" stroke="#ff9900" stroke-width="1.6"/>
  <text x="1172.0" y="250.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">2 · Autoscaler notices</text>
  <text x="1172.0" y="266.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">its pod runs in kube-system</text>
  <path id="p1" d="M 1172.0 200.0 L 1172.0 224.0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff9900)"/>
  <circle r="4.5" fill="#ff9900" filter="url(#glow)"><animateMotion dur="0.9s" begin="0.35s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <rect x="1000" y="304" width="344" height="52" rx="12" fill="#ff9900" fill-opacity="0.14" stroke="#ff9900" stroke-width="1.6"/>
  <text x="1172.0" y="328.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">3 · AWS STS checks its token</text>
  <text x="1172.0" y="344.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">must be THIS service account</text>
  <path id="p2" d="M 1172.0 278.0 L 1172.0 302.0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff9900)"/>
  <circle r="4.5" fill="#ff9900" filter="url(#glow)"><animateMotion dur="0.9s" begin="0.70s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <rect x="1000" y="382" width="344" height="52" rx="12" fill="#ff9900" fill-opacity="0.14" stroke="#ff9900" stroke-width="1.6"/>
  <text x="1172.0" y="406.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">4 · Temporary credentials</text>
  <text x="1172.0" y="422.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">role limited to this cluster</text>
  <path id="p3" d="M 1172.0 356.0 L 1172.0 380.0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff9900)"/>
  <circle r="4.5" fill="#ff9900" filter="url(#glow)"><animateMotion dur="0.9s" begin="1.05s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <rect x="1000" y="460" width="344" height="52" rx="12" fill="#ff9900" fill-opacity="0.14" stroke="#ff9900" stroke-width="1.6"/>
  <text x="1172.0" y="484.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">5 · Node group grows</text>
  <text x="1172.0" y="500.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">SetDesiredCapacity on its ASG</text>
  <path id="p4" d="M 1172.0 434.0 L 1172.0 458.0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff9900)"/>
  <circle r="4.5" fill="#ff9900" filter="url(#glow)"><animateMotion dur="0.9s" begin="1.40s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  <rect x="1000" y="538" width="344" height="52" rx="12" fill="#ff9900" fill-opacity="0.14" stroke="#ff9900" stroke-width="1.6"/>
  <text x="1172.0" y="562.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">6 · Pod is scheduled</text>
  <text x="1172.0" y="578.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">idle nodes are removed later</text>
  <path id="p5" d="M 1172.0 512.0 L 1172.0 536.0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff9900)"/>
  <circle r="4.5" fill="#ff9900" filter="url(#glow)"><animateMotion dur="0.9s" begin="1.75s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  <path id="p6" d="M 186.0 164.0 L 186.0 194.0" stroke="#e6edf3" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#ae6edf3)"/>
  <circle r="4.5" fill="#e6edf3" filter="url(#glow)"><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
  <path id="p7" d="M 336.0 268.0 L 378.0 268.0" stroke="#4facfe" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#a4facfe)"/>
  <circle r="4.5" fill="#4facfe" filter="url(#glow)"><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion></circle>
  <text x="358.0" y="258.0" font-size="11" fill="#4facfe" text-anchor="middle" font-weight="700">schedules</text>
  <path id="p8" d="M 186.0 532.0 L 186.0 560.0" stroke="#ff4f9a" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff4f9a)"/>
  <circle r="4.5" fill="#ff4f9a" filter="url(#glow)"><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#p8"/></animateMotion></circle>
  <path id="p9" d="M 940.0 174.0 L 998.0 174.0" stroke="#c471f5" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#ac471f5)"/>
  <circle r="4.5" fill="#c471f5" filter="url(#glow)"><animateMotion dur="1.2s" begin="0.00s" repeatCount="indefinite"><mpath href="#p9"/></animateMotion></circle>
  <text x="968.0" y="164.0" font-size="11" fill="#c471f5" text-anchor="middle" font-weight="700">Pending</text>
  <path id="p10" d="M 1000.0 486.0 L 942.0 486.0" stroke="#ff9900" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff9900)"/>
  <circle r="4.5" fill="#ff9900" filter="url(#glow)"><animateMotion dur="1.2s" begin="0.00s" repeatCount="indefinite"><mpath href="#p10"/></animateMotion></circle>
  <text x="970.0" y="476.0" font-size="11" fill="#ff9900" text-anchor="middle" font-weight="700">+ node</text>
  <path id="p11" d="M 336.0 592.0 L 960.0 592.0 L 960.0 330.0 L 998.0 330.0" stroke="#ff4f9a" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#aff4f9a)"/>
  <circle r="4.5" fill="#ff4f9a" filter="url(#glow)"><animateMotion dur="3.6s" begin="0.00s" repeatCount="indefinite"><mpath href="#p11"/></animateMotion></circle>
  <circle r="4.5" fill="#ff4f9a" filter="url(#glow)"><animateMotion dur="3.6s" begin="1.80s" repeatCount="indefinite"><mpath href="#p11"/></animateMotion></circle>
  <text x="650.0" y="584.0" font-size="11" fill="#ff4f9a" text-anchor="middle" font-weight="700">the token is verified against the cluster&#x27;s OIDC issuer</text>
  <rect x="36" y="656" width="1328" height="118" rx="16" fill="#00c9a7" fill-opacity="0.05" stroke="#00c9a7" stroke-width="1.8"/>
  <text x="52.0" y="682.0" font-size="14.5" fill="#00c9a7" text-anchor="start" font-weight="700">🔁 Zero-downtime node upgrade · one variable in terraform.tfvars</text>
  <rect x="80" y="700" width="300" height="54" rx="12" fill="#00c9a7" fill-opacity="0.14" stroke="#00c9a7" stroke-width="1.6"/>
  <text x="230.0" y="725.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">node_color = &quot;blue&quot;</text>
  <text x="230.0" y="741.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">only the blue groups exist</text>
  <rect x="550" y="700" width="300" height="54" rx="12" fill="#00c9a7" fill-opacity="0.14" stroke="#00c9a7" stroke-width="1.6"/>
  <text x="700.0" y="725.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">node_color = &quot;both&quot;</text>
  <text x="700.0" y="741.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">blue and green side by side</text>
  <rect x="1020" y="700" width="300" height="54" rx="12" fill="#00c9a7" fill-opacity="0.14" stroke="#00c9a7" stroke-width="1.6"/>
  <text x="1170.0" y="725.2" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">node_color = &quot;green&quot;</text>
  <text x="1170.0" y="741.2" font-size="11.5" fill="#b6c2d1" text-anchor="middle">blue is removed</text>
  <path id="p12" d="M 380.0 727.0 L 548.0 727.0" stroke="#00c9a7" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#a00c9a7)"/>
  <circle r="4.5" fill="#00c9a7" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite"><mpath href="#p12"/></animateMotion></circle>
  <text x="465.0" y="718.0" font-size="11" fill="#00c9a7" text-anchor="middle" font-weight="700">1 · green comes up</text>
  <path id="p13" d="M 850.0 727.0 L 1018.0 727.0" stroke="#00c9a7" stroke-width="2.4" fill="none" stroke-linejoin="round" class="flow" marker-end="url(#a00c9a7)"/>
  <circle r="4.5" fill="#00c9a7" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite"><mpath href="#p13"/></animateMotion></circle>
  <text x="935.0" y="718.0" font-size="11" fill="#00c9a7" text-anchor="middle" font-weight="700">2 · pods move over</text>
  <rect x="24" y="800" width="1352" height="40" rx="12" fill="#8b98ad" fill-opacity="0.05" stroke="#8b98ad" stroke-width="1"/>
  <circle cx="40" cy="819" r="6" fill="#4facfe"/>
  <text x="53.0" y="823.5" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">Control plane</text>
  <circle cx="181.14960000000002" cy="819" r="6" fill="#c471f5"/>
  <text x="194.1" y="823.5" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">Node groups</text>
  <circle cx="313.90400000000005" cy="819" r="6" fill="#ff9900"/>
  <text x="326.9" y="823.5" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">Autoscaling</text>
  <circle cx="443.4402400000001" cy="819" r="6" fill="#ff4f9a"/>
  <text x="456.4" y="823.5" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">Pod identity (IRSA)</text>
  <circle cx="631.4630400000001" cy="819" r="6" fill="#00c9a7"/>
  <text x="644.5" y="823.5" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700">Blue / green switch</text>
</svg>
