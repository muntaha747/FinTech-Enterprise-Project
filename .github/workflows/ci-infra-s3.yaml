name: Terraform S3 CI Pipeline (Dev Branch Only For Testing the infra)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest 
#
    defaults:
      run:
        working-directory: ./infra-modules/qa/s3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show what GitHub sends to AWS
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req))['value']
          part = token.split('.')[1]
          part += '=' * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          print({k: claims[k] for k in ('iss', 'aud', 'sub')})
          EOF 
#
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.FinTech_Enterprise_Project_GithubActions_OIDC_Role  }}
          aws-region: us-east-1


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

    
      - name: Terraform Format
        run: terraform fmt -check

    
      - name: Terraform Init
        run: terraform init

   
      - name: Checkov Scan
        run: |
          pip install checkov
          checkov -d . --soft-fail

     
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: terraform apply -auto-approve tfplan

      - name: Post-Deployment Test
        run: |
          echo "Pipeline finished successfully!"
          echo "You can add bash scripts here to test if your infrastructure is running."

      - name: Terraform Destroy
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: terrafomr destroy -auto-approve