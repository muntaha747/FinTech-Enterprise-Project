name: Terraform S3 CI Pipeline (Dev Branch Only For Testing the infra) #

# 🔑 Disabled: Empty trigger list prevents this workflow from ever running automatically
on: []

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
#
    defaults:
      run:
        working-directory: ./infra-modules/qa/s3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.FinTech_Enterprise_Project_GithubActions_OIDC_Role  }}
          aws-region: us-east-1


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

    
      - name: Terraform Format
        run: terraform fmt -check

    
      - name: Terraform Init
        run: terraform init

   
      - name: Checkov Scan
        run: |
          pipx install checkov
          checkov -d . --soft-fail

     
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: terraform apply -auto-approve tfplan

      - name: Post-Deployment Test
        run: |
          echo "Pipeline finished successfully!"
          echo "You can add bash scripts here to test if your infrastructure is running."

      - name: Terraform Destroy
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: terraform destroy -auto-approve
